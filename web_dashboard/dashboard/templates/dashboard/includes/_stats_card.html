<!-- dashboard/templates/dashboard/includes/_stats_card.html — UI/UX Redesign v2 -->
<!--
  Reusable statistics card component.

  CONTEXT VARIABLES:
    - icon:       Bootstrap Icon class (e.g., "bi-bar-chart-fill")
    - value:      The numeric value to display
    - label:      Short label below the value
    - subtitle:   Optional smaller text below the label
    - color:      CSS color class for accent (default: "text-accent")
    - glow:       Glow variant class (e.g., "glow-accent", "glow-danger")
-->

<div class="stat-card {{ glow|default:'' }}">
  <div class="stat-card-header">
    <div class="stat-title">{{ label|default:"Metric" }}</div>
    <div class="stat-icon" style="background: rgba(var(--soc-accent-rgb), 0.08);">
      <i class="bi {{ icon|default:'bi-bar-chart' }} {{ color|default:'text-accent' }}"></i>
    </div>
  </div>
  <div class="stat-value">{{ value|default:"0" }}</div>
  {% if subtitle %}
  <div class="stat-trend">
    {% if trend_icon %}<i class="bi {{ trend_icon }}"></i>{% endif %}
    {{ subtitle }}
  </div>
  {% endif %}
</div>
