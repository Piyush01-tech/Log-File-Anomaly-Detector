<!-- dashboard/templates/dashboard/includes/_stats_card.html — Phase 11A -->
<!--
  Reusable statistics card component.

  CONTEXT VARIABLES (pass via {% include ... with %}):
    - icon:       Bootstrap Icon class (e.g., "bi-bar-chart-fill")
    - value:      The numeric value to display
    - label:      Short label below the value
    - subtitle:   Optional smaller text below the label
    - color:      CSS color class for accent (default: "text-accent")
    - border:     Border accent class (default: "border-accent")
    - icon_bg:    Background class for icon container (default: uses accent)

  USAGE:
    {% include "dashboard/includes/_stats_card.html" with
       icon="bi-file-earmark-check" value=total_jobs label="Total Analyses"
       subtitle="System Wide" color="text-accent" border="border-accent" %}
-->

<div class="stat-card d-flex align-items-center {{ border|default:'border-accent' }} border-start border-3">
  <div class="stat-card-icon me-3">
    <div class="stat-icon-wrapper {{ icon_bg|default:'' }}">
      <i class="bi {{ icon|default:'bi-bar-chart' }} {{ color|default:'text-accent' }}"></i>
    </div>
  </div>
  <div class="stat-card-content">
    <div class="stat-value {{ color|default:'text-accent' }}">{{ value|default:"0" }}</div>
    <div class="stat-label">{{ label|default:"Metric" }}</div>
    {% if subtitle %}
    <small class="text-muted">{{ subtitle }}</small>
    {% endif %}
  </div>
</div>
