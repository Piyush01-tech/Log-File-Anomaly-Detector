<!-- dashboard/templates/dashboard/includes/_severity_badge.html — UI/UX Redesign v2 -->
<!--
  Reusable severity badge for Anomaly.Severity values.

  CONTEXT VARIABLES:
    - severity: The severity string (CRITICAL, HIGH, MEDIUM, LOW)
    - severity_display: Human-readable severity label
-->

{% if severity == 'CRITICAL' %}
  <span class="soc-badge badge-critical pulse-badge">
    <i class="bi bi-shield-x me-1"></i>{{ severity_display|default:"Critical" }}
  </span>
{% elif severity == 'HIGH' %}
  <span class="soc-badge badge-high">
    <i class="bi bi-exclamation-triangle me-1"></i>{{ severity_display|default:"High" }}
  </span>
{% elif severity == 'MEDIUM' %}
  <span class="soc-badge badge-medium">
    <i class="bi bi-exclamation-circle me-1"></i>{{ severity_display|default:"Medium" }}
  </span>
{% else %}
  <span class="soc-badge badge-low">
    <i class="bi bi-info-circle me-1"></i>{{ severity_display|default:"Low" }}
  </span>
{% endif %}
