<!-- dashboard/templates/dashboard/includes/_empty_state.html — Phase 11A -->
<!--
  Reusable empty state component for sections with no data.

  CONTEXT VARIABLES (pass via {% include ... with %}):
    - icon:       Bootstrap Icon class (e.g., "bi-inbox")
    - title:      Heading text (e.g., "No analyses yet")
    - message:    Description text
    - action_url: Optional URL for CTA button
    - action_text: Optional CTA button text

  USAGE:
    {% include "dashboard/includes/_empty_state.html" with
       icon="bi-cloud-arrow-up" title="No uploads yet"
       message="Upload your first .evtx file to get started."
       action_url="/upload/" action_text="Upload File" %}
-->

<div class="empty-state text-center py-4">
  <div class="empty-state-icon mb-3">
    <i class="bi {{ icon|default:'bi-inbox' }}"></i>
  </div>
  <h6 class="empty-state-title">{{ title|default:"No data available" }}</h6>
  <p class="empty-state-message text-muted small mb-3">
    {{ message|default:"There's nothing to display here yet." }}
  </p>
  {% if action_url and action_text %}
  <a href="{{ action_url }}" class="btn btn-accent btn-sm">
    <i class="bi bi-plus-lg me-1"></i> {{ action_text }}
  </a>
  {% endif %}
</div>
