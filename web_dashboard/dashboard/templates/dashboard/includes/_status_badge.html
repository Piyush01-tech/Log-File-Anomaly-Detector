<!-- dashboard/templates/dashboard/includes/_status_badge.html — UI/UX Redesign v2 -->
<!--
  Reusable status badge for AnalysisJob.Status values.

  CONTEXT VARIABLES:
    - status: The status string (COMPLETED, FAILED, RUNNING, PENDING)
-->

{% if status == 'COMPLETED' %}
  <span class="soc-badge badge-success" id="status-badge-completed">
    <i class="bi bi-check-circle-fill me-1"></i>Completed
  </span>
{% elif status == 'FAILED' %}
  <span class="soc-badge badge-critical" id="status-badge-failed">
    <i class="bi bi-x-circle-fill me-1"></i>Failed
  </span>
{% elif status == 'RUNNING' %}
  <span class="soc-badge badge-medium" id="status-badge-running">
    <i class="bi bi-arrow-repeat me-1 spin-slow"></i>Running
  </span>
{% else %}
  <span class="soc-badge badge-low" id="status-badge-pending">
    <i class="bi bi-hourglass me-1"></i>Pending
  </span>
{% endif %}
