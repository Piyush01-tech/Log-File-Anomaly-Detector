<!-- dashboard/templates/dashboard/errors/500.html — UI/UX Redesign v2 -->
{% extends "dashboard/base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 col-lg-5">
    <div class="text-center mb-5">
      <div class="mx-auto mb-4 d-inline-flex align-items-center justify-content-center" style="width: 96px; height: 96px; background: rgba(var(--soc-danger-rgb), 0.08); border-radius: 50%; border: 1px solid rgba(var(--soc-danger-rgb), 0.2); box-shadow: 0 0 32px rgba(var(--soc-danger-rgb), 0.15);">
        <i class="bi bi-exclamation-octagon text-danger" style="font-size: 44px;"></i>
      </div>
      <h1 class="display-3 fw-bold text-danger mb-2" style="letter-spacing: -0.03em;">500</h1>
      <h2 class="h3 fw-bold mb-3">Internal Server Error</h2>
    </div>

    <div class="soc-card mb-4">
      <div class="soc-card-body text-center py-5">
        <p class="text-muted mb-4 fw-medium" style="font-size: 15px;">
          Something went wrong on our end. Our team has been notified.
        </p>
        <p class="text-muted small mb-5">
          Please try again in a few moments, or contact your system administrator.
        </p>
        <div class="d-flex justify-content-center gap-3">
          <a href="{% url 'dashboard:home' %}" class="btn-soc btn-primary-soc px-4 py-2">
            <i class="bi bi-house me-2"></i> Dashboard
          </a>
          <button onclick="location.reload()" class="btn-soc btn-outline-soc px-4 py-2">
            <i class="bi bi-arrow-clockwise me-2"></i> Retry
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
